<!doctype html>
<meta charset="utf-8" />
<title>ChatSweeper preview fixture</title>
<style>
  body {
    background: #ededf2;
    font-family: system-ui;
  }

  nav {
    position: absolute;
    left: -10000px;
  }

  html[data-theme="dark"] body {
    background: #14141c;
  }
</style>

<body>
  <nav id="fixture" aria-label="Chat history"></nav>
  <script>
    globalThis.chrome = { runtime: { onMessage: { addListener() {} } } };
  </script>
  <script src="storage.js"></script>
  <script>
    const mode = new URLSearchParams(location.search).get("theme") || "light";
    storageFixture.data["chatsweeper:theme"] = mode;
    document.documentElement.dataset.theme = mode;
    const titles = [
      "Planning a weekend in Kyoto",
      "Ideas for the next chapter",
      "A better morning routine",
      "Portfolio website inspiration",
      "Learning to make sourdough",
      "Notes on the garden redesign",
      "Birthday dinner recipes",
      "Reading list for winter",
      "Understanding CSS layouts",
      "A little help with Python",
      "The very important chat",
      "Holiday packing checklist",
    ];
    titles.forEach((title, i) => {
      const row = document.createElement("div");
      row.dataset.testid = "history-item-" + i;
      const a = document.createElement("a");
      a.href = "https://chatgpt.com/c/preview-" + i;
      a.textContent = title;
      row.append(a);
      document.getElementById("fixture").append(row);
    });
    storageFixture.data["chat-manager:protected:chatgpt:preview-1"] = true;
    storageFixture.data["chat-manager:protected:chatgpt:preview-10"] = true;
  </script>
  <script src="../extension/sites.js"></script>
  <script>
    const getSite = ChatSites.forLocation;
    ChatSites.forLocation = () => getSite(new URL("https://chatgpt.com/"));
  </script>
  <script src="../extension/protection.js"></script>
  <script src="../extension/ui.js"></script>
  <script src="../extension/theme.js"></script>
  <script src="../extension/dialogs.js"></script>
  <script src="../extension/content.js"></script>
  <script>
    setTimeout(() => {
      const root = document.getElementById("chatsweeper-root").shadowRoot;
      const style = document.createElement("style");
      style.textContent =
        "#panel{left:50%;right:auto;transform:translateX(-50%);top:20px;bottom:20px}#launch{display:none}";
      root.append(style);
      root.getElementById("launch").click();
      root.querySelector(".chat input:not(:disabled)").click();
      const focusId = new URLSearchParams(location.search).get("focus");
      if (focusId) root.getElementById(focusId)?.focus({ preventScroll: true });
      if (new URLSearchParams(location.search).has("completed"))
        root.getElementById("status").textContent =
          "7 chats deleted. Finished.";
      if (new URLSearchParams(location.search).has("about"))
        root.getElementById("about").click();
    }, 100);
  </script>
</body>
